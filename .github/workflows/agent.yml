name: Agent
on:
  push:
    branches: [main]
    tags: ['agent-v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: go test -race ./...
        working-directory: agent
      - run: bin/test-agent.sh
      - run: docker build -t yuniview-agent:test agent
  publish:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned agent
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/yuniview-agent:${TAG#agent-v}"
          docker build -t "$image" agent
          docker push "$image"
