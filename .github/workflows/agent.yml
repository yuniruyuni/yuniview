name: Agent
on:
  push:
    branches: [main]
    tags: ['agent-v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: go test -race ./...
        working-directory: agent
      - run: bin/test-agent.sh
      - run: docker build -t yuniview-agent:test agent
  publish:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned agent
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/yuniview-agent:${TAG#agent-v}"
          docker build -t "$image" agent
          docker push "$image"
