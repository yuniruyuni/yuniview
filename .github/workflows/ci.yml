name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run tests
        run: bun run check:test

      - name: Build project
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: e2e
        run: bun playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: bun run check:e2e

      - name: Verify console with PostgreSQL and Chromium
        run: bin/test-console.sh

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t yuniview .

      - name: Test Docker image
        run: |
          # DB を用意せず /health だけ見る smoke test なので、
          # SKIP_DB_VERIFY=1 で起動時 SELECT 1 検証を skip する
          docker run --rm -d -p 3000:3000 \
            -e SKIP_DB_VERIFY=1 \
            --name test-container yuniview
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container
